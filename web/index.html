<title>Snowfall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Gowun+Batang:wght@400;700&family=DM+Mono:wght@300;400&display=swap">
<style>
/* Layout: a full-bleed WebGL canvas with a quiet, centred-low typographic overlay (film-subtitle convention). */
:root {
  --ink: #050608;        /* letterbox black, slightly blue */
  --snow: #eef1f4;       /* primary text: cold paper white */
  --ash: #9aa1aa;        /* shadow's voice, secondary text */
  --ember: #f2d7b4;      /* her voice: warm candle */
  --frost: #b9cbe0;      /* radio, hints */
  --blood: #b3262b;      /* red rooms, chained doors */
  --serif: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --serif-ko: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sub: clamp(17px, 1.55vw, 25px);
  color-scheme: dark;
}
html, body { height: 100%; background: var(--ink); color: var(--snow); overflow: hidden; }
body { font-family: var(--serif); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: none; }
body.ko { font-family: var(--serif-ko); }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--ink); cursor: none; }
.layer { position: fixed; inset: 0; pointer-events: none; }

/* subtitles */
#line { position: fixed; left: 50%; bottom: calc(10vh + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 6px); width: min(860px, calc(100vw - 48px)); text-align: center;
  font-size: var(--sub); line-height: 1.45; letter-spacing: 0.01em; opacity: 0; transition: opacity .6s ease, transform .6s ease; text-wrap: balance;
  text-shadow: 0 0 18px rgba(0,0,0,.85), 0 1px 3px rgba(0,0,0,.9); pointer-events: none; }
#line.show { opacity: 1; transform: translate(-50%, 0); }
.who-him { color: var(--snow); }
.who-her { color: var(--ember); }
.who-shadow { color: var(--ash); font-style: italic; letter-spacing: .04em; }
.who-narr { color: #d9dde2; font-style: italic; font-weight: 300; }
body.ko .who-narr, body.ko .who-shadow { font-style: normal; }
.who-radio { color: var(--frost); font-family: var(--mono); font-size: calc(var(--sub) * .8) !important; letter-spacing: .06em; }
.flicker { animation: flick 1.6s steps(12) infinite; }
@keyframes flick { 0%,100%{opacity:1} 30%{opacity:.75} 31%{opacity:1} 62%{opacity:.6} 63%{opacity:1} }

/* choices */
#choices { position: fixed; left: 50%; bottom: calc(18vh + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; align-items: center; opacity: 0; transition: opacity .5s; pointer-events: none; }
#choices.show { opacity: 1; pointer-events: auto; }
.choice { font: inherit; font-size: calc(var(--sub) * .95); color: var(--snow); background: rgba(8,10,14,.35); border: 1px solid rgba(238,241,244,.18); padding: 10px 22px 10px 14px; display: flex; gap: 14px; align-items: baseline; cursor: pointer; backdrop-filter: blur(6px); transition: border-color .3s, background .3s, opacity .4s; min-width: min(380px, 80vw); }
.choice:hover, .choice:focus-visible { border-color: rgba(238,241,244,.6); background: rgba(20,24,30,.5); outline: none; }
.choice .k { font-family: var(--mono); font-size: 12px; color: var(--ash); }
.choice.picked { border-color: var(--snow); }
#choices.show .choice:not(.picked) { }

/* crosshair + prompt */
#dot { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(238,241,244,.55); transition: transform .3s, background .3s, opacity .4s; }
#dot.focus { transform: scale(2.2); background: rgba(238,241,244,.9); }
#ring { position: fixed; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; opacity: 0; transition: opacity .2s; transform: rotate(-90deg); }
#ring circle { fill: none; stroke: rgba(238,241,244,.85); stroke-width: 1.5; stroke-dasharray: 113; stroke-dashoffset: 113; }
#prompt { position: fixed; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity .4s; white-space: nowrap; text-shadow: 0 0 12px rgba(0,0,0,.9); }
#prompt.show { opacity: 1; }
#prompt .label { font-size: clamp(15px, 1.2vw, 19px); font-style: italic; color: var(--snow); }
body.ko #prompt .label { font-style: normal; }
#prompt .act { display: block; margin-top: 4px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); }
#prompt .seen { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--frost); opacity: .7; }

#hint { position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--frost); opacity: 0; transition: opacity 1.2s; text-shadow: 0 0 10px rgba(0,0,0,.8); white-space: nowrap; }
#hint.show { opacity: .85; }
#toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-family: var(--mono); font-size: 11px; color: var(--ash); opacity: 0; transition: opacity .6s; }
#toast.show { opacity: .8; }
#loading { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--ash); opacity: 0; transition: opacity .6s; }
#loading.show { opacity: .7; animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .25; } }

/* title */
#title { position: fixed; inset: 0; display: grid; place-items: end center; padding-bottom: calc(7vh + env(safe-area-inset-bottom, 0px)); opacity: 0; pointer-events: none; transition: opacity 1.8s ease; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#title.show { opacity: 1; pointer-events: auto; }
#title::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,10,14,.62) 0%, rgba(8,10,14,.28) 34%, rgba(8,10,14,0) 58%); pointer-events: none; }
#title .wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
#title h1 { margin: 0 0 4px; font-family: var(--serif); font-weight: 300; font-style: italic; font-size: clamp(56px, 8.5vw, 132px); letter-spacing: .02em; line-height: .9; color: var(--snow); text-shadow: 0 0 40px rgba(255,255,255,.18); }
#title .warn { max-width: 34em; font-size: clamp(15px, 1.25vw, 18px); color: #cfd4da; line-height: 1.5; }
#title .warn small { display: block; color: var(--ash); font-size: .9em; margin-top: 4px; }
.btn { font: inherit; font-size: clamp(18px, 1.6vw, 23px); color: var(--snow); background: none; border: 0; border-bottom: 1px solid rgba(238,241,244,.35); padding: 4px 2px; cursor: pointer; letter-spacing: .06em; transition: border-color .3s, color .3s; }
.btn:hover, .btn:focus-visible { border-color: var(--snow); outline: none; }
.btns { display: flex; gap: 34px; align-items: baseline; flex-wrap: wrap; justify-content: center; }
#ctrl { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: #b9bfc7; max-width: 90vw; line-height: 1.7; }
.row { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid rgba(238,241,244,.2); }
.seg button { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--ash); background: none; border: 0; padding: 6px 10px; cursor: pointer; }
.seg button.on { color: var(--ink); background: var(--snow); }
.seg button:focus-visible { outline: 1px solid var(--snow); }

/* pause */
#pause { position: fixed; inset: 0; background: rgba(5,6,8,.72); backdrop-filter: blur(10px); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .4s; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#pause.show { opacity: 1; pointer-events: auto; }
#pause .panel { width: min(560px, 100%); display: flex; flex-direction: column; gap: 18px; max-height: 92vh; overflow: auto; padding-block: 12px; }
#pause h2 { margin: 0; font-weight: 300; font-style: italic; font-size: 42px; }
.set { display: grid; grid-template-columns: 9em 1fr; gap: 10px; align-items: center; }
.set label { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); }
input[type=range] { width: 100%; accent-color: #dfe5ec; }
body.ko #pause h2, body.ko .choice, body.ko #prompt .label { font-style: normal; }
.set > .seg { justify-self: start; }
#chapters { display: flex; flex-wrap: wrap; gap: 8px 16px; }
#chapters button { font: inherit; font-size: 17px; color: var(--snow); background: none; border: 0; border-bottom: 1px solid rgba(238,241,244,.25); padding: 2px 0; cursor: pointer; }
#chapters button:disabled { color: #4a4f57; border-color: transparent; cursor: default; }

/* end */
#end { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; opacity: 0; pointer-events: none; transition: opacity 3s; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#end.show { opacity: 1; pointer-events: auto; }
#end .wrap { display: flex; flex-direction: column; gap: 18px; align-items: center; max-width: 40em; }
#end h1 { margin: 0; font-weight: 300; font-style: italic; font-size: clamp(48px, 7vw, 104px); color: #2a2d33; }
#end p { margin: 0; color: #3b3f46; line-height: 1.6; }
#end .credits { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: #5a5f67; line-height: 1.8; }
#end .help { color: #2c3036; font-size: 18px; }
#end .help small { display: block; font-family: var(--mono); font-size: 12px; color: #4b5058; margin-top: 6px; letter-spacing: .04em; user-select: text; -webkit-user-select: text; }
#end .btn { color: #2a2d33; border-color: rgba(42,45,51,.4); }
.closed { font-style: italic; color: #6a6f77 !important; }
@media (prefers-reduced-motion: reduce) { #line, #choices, #title, #end { transition-duration: .01s; } }
</style>

<canvas id="gl" aria-label="snowfall"></canvas>
<div class="layer">
  <div id="dot"></div>
  <svg id="ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18"></circle></svg>
  <div id="prompt"><span class="label"></span><span class="act"></span><span class="seen"></span></div>
  <div id="line" class="line"></div>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="loading" data-t="ui.loading"></div>
</div>
<div id="choices"></div>

<section id="title" aria-label="title">
  <div class="wrap">
    <h1 data-t="ui.title">snowfall</h1>
    <div class="warn"><span data-t="ui.warning"></span><small data-t="ui.warning2"></small></div>
    <div class="btns">
      <button class="btn" id="begin" data-t="ui.begin">Begin</button>
    </div>
    <div class="row">
      <div class="seg lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="ko">한국어</button></div>
      <div class="seg q" role="group" aria-label="Quality"><button data-q="low" data-t="ui.q_low"></button><button data-q="medium" data-t="ui.q_medium"></button><button data-q="high" data-t="ui.q_high"></button></div>
    </div>
    <div id="ctrl"></div>
  </div>
</section>

<section id="pause" aria-label="pause">
  <div class="panel">
    <h2 data-t="ui.paused">Paused</h2>
    <div class="set"><label for="s-master" data-t="ui.master"></label><input type="range" id="s-master" min="0" max="1" step="0.01"></div>
    <div class="set"><label for="s-music" data-t="ui.music"></label><input type="range" id="s-music" min="0" max="1" step="0.01"></div>
    <div class="set"><label for="s-sfx" data-t="ui.sfx"></label><input type="range" id="s-sfx" min="0" max="1" step="0.01"></div>
    <div class="set"><label for="s-bright" data-t="ui.bright"></label><input type="range" id="s-bright" min="0.6" max="1.6" step="0.01"></div>
    <div class="set"><label for="s-sens" data-t="ui.sens"></label><input type="range" id="s-sens" min="0.3" max="2.5" step="0.01"></div>
    <div class="set"><label for="s-subSize" data-t="ui.subsize"></label><input type="range" id="s-subSize" min="0.8" max="1.6" step="0.01"></div>
    <div class="set"><label data-t="ui.language"></label><div class="seg lang"><button data-lang="en">EN</button><button data-lang="ko">한국어</button></div></div>
    <div class="set"><label data-t="ui.quality"></label><div class="seg q"><button data-q="low" data-t="ui.q_low"></button><button data-q="medium" data-t="ui.q_medium"></button><button data-q="high" data-t="ui.q_high"></button></div></div>
    <div class="set"><label data-t="ui.chapters"></label><div id="chapters"></div></div>
    <div><button class="btn" id="resume" data-t="ui.resume">Resume</button></div>
  </div>
</section>

<section id="end" aria-label="end">
  <div class="wrap">
    <h1>snowfall</h1>
    <p class="closed"></p>
    <p data-t="end.thanks"></p>
    <div class="credits"><div data-t="end.credit_story"></div><div data-t="end.credit_assets"></div></div>
    <p class="help"><span data-t="end.help"></span><small data-t="end.help2"></small></p>
    <button class="btn" id="again" data-t="end.again">Play again</button>
  </div>
</section>

  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module" src="js/main.js"></script>
